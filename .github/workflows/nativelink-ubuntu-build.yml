name: Build nativelink-ubuntu

on:
  push:
    branches:
      - main
    paths:
      - 'nativelink-ubuntu/src/**'
      - '.github/workflows/nativelink-ubuntu-build.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'nativelink-ubuntu/src/**'
      - '.github/workflows/nativelink-ubuntu-build.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/nativelink-ubuntu

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Resolve latest nativelink container tag
        id: nativelink_tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          API=https://api.github.com/repos/tracemachina/nativelink
          tag=""

          run_id=$(curl -sfL "$API/actions/workflows/image.yaml/runs?branch=main&status=success&per_page=1" \
              | jq -r '.workflow_runs[0].id') || true
          echo "Latest image.yaml run: ${run_id:-none}"

          if [ -n "$run_id" ] && [ "$run_id" != "null" ]; then
            job_id=$(curl -sfL "$API/actions/runs/$run_id/jobs" \
                | jq -r '.jobs[] | select(.name == "Publish image") | .id') || true
            echo "Publish image job: ${job_id:-none}"

            if [ -n "$job_id" ] && [ "$job_id" != "null" ]; then
              tag=$(gh api "/repos/tracemachina/nativelink/actions/jobs/$job_id/logs" \
                  2>/dev/null | grep -o 'IMAGE_TAG=[a-z0-9]*' | head -1 | cut -d= -f2) || true
            fi
          fi

          if [ -z "$tag" ]; then
            echo "Could not extract IMAGE_TAG from logs; falling back to latest release."
            tag=$(curl -sfL "$API/releases/latest" | jq -r .tag_name) || true
          fi

          if [ -z "$tag" ] || [ "$tag" = "null" ]; then
            echo "Failed to resolve any nativelink tag" >&2
            exit 1
          fi
          echo "Using nativelink tag: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./nativelink-ubuntu/src
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=nativelink-ubuntu
          cache-to: type=gha,mode=max,scope=nativelink-ubuntu
          build-args: |
            NATIVELINK_TAG=${{ steps.nativelink_tag.outputs.tag }}
            CACHEBUST=${{ github.run_id }}
