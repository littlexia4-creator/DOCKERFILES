name: Build and Push Docker Images

on:
  push:
    branches:
      - main
    paths:
      - 'proxy-server/src/**'
      - 'nativelink-ubuntu/src/**'
      - '.github/workflows/docker-build.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has-changes: ${{ steps.set-matrix.outputs.has-changes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            proxy-server:
              - 'proxy-server/src/**'
            nativelink-ubuntu:
              - 'nativelink-ubuntu/src/**'
            workflow:
              - '.github/workflows/docker-build.yml'

      - name: Build dynamic matrix
        id: set-matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_CHANGED: ${{ steps.filter.outputs.workflow }}
          PROXY_CHANGED: ${{ steps.filter.outputs.proxy-server }}
          NATIVELINK_CHANGED: ${{ steps.filter.outputs.nativelink-ubuntu }}
        run: |
          set -euo pipefail
          proxy='{"name":"proxy-server","context":"./proxy-server/src","platforms":"linux/amd64,linux/arm64"}'
          nativelink='{"name":"nativelink-ubuntu","context":"./nativelink-ubuntu/src","platforms":"linux/amd64"}'

          # Workflow-file edits or manual dispatch rebuild everything, so logic changes can't skip images.
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$WORKFLOW_CHANGED" = "true" ]; then
            include="[$proxy,$nativelink]"
          else
            include="[]"
            [ "$PROXY_CHANGED"      = "true" ] && include=$(jq -cn --argjson i "$include" --argjson e "$proxy"      '$i + [$e]')
            [ "$NATIVELINK_CHANGED" = "true" ] && include=$(jq -cn --argjson i "$include" --argjson e "$nativelink" '$i + [$e]')
          fi

          echo "matrix={\"include\":$include}" >> "$GITHUB_OUTPUT"
          if [ "$include" = "[]" ]; then
            echo "has-changes=false" >> "$GITHUB_OUTPUT"
            echo "No image sources changed — build job will be skipped."
          else
            echo "has-changes=true" >> "$GITHUB_OUTPUT"
            echo "Will build: $include"
          fi

  build:
    needs: changes
    if: needs.changes.outputs.has-changes == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.changes.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Resolve latest nativelink container tag
        if: matrix.name == 'nativelink-ubuntu'
        id: nativelink_tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Upstream image.yaml publishes a nix-hash-tagged image on every push to main.
          # Parse the IMAGE_TAG from the latest successful "Publish image" job logs.
          run_id=$(gh api /repos/tracemachina/nativelink/actions/workflows/image.yaml/runs \
              -f branch=main -f status=success -f per_page=1 \
              --jq '.workflow_runs[0].id')
          echo "Latest image.yaml run: $run_id"

          job_id=$(gh api "/repos/tracemachina/nativelink/actions/runs/$run_id/jobs" \
              --jq '.jobs[] | select(.name == "Publish image") | .id')
          echo "Publish image job: $job_id"

          tag=$(gh api "/repos/tracemachina/nativelink/actions/jobs/$job_id/logs" \
              2>/dev/null | grep -o 'IMAGE_TAG=[a-z0-9]*' | head -1 | cut -d= -f2) || true

          # Fall back to the latest GitHub Release if log parsing fails.
          if [ -z "$tag" ]; then
            echo "Could not extract IMAGE_TAG from logs; falling back to latest release."
            tag=$(curl -sfL https://api.github.com/repos/tracemachina/nativelink/releases/latest | jq -r .tag_name)
          fi

          if [ -z "$tag" ] || [ "$tag" = "null" ]; then
            echo "Failed to resolve any nativelink tag" >&2
            exit 1
          fi
          echo "Using nativelink tag: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.name }} image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          platforms: ${{ matrix.platforms }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          build-args: |
            NATIVELINK_TAG=${{ steps.nativelink_tag.outputs.tag }}
