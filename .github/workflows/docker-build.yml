name: Build and Push Docker Images

on:
  push:
    branches:
      - main
    paths:
      - 'proxy-server/src/**'
      - 'nativelink-ubuntu/src/**'
      - '.github/workflows/docker-build.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has-changes: ${{ steps.set-matrix.outputs.has-changes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            proxy-server:
              - 'proxy-server/src/**'
            nativelink-ubuntu:
              - 'nativelink-ubuntu/src/**'
            workflow:
              - '.github/workflows/docker-build.yml'

      - name: Build dynamic matrix
        id: set-matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_CHANGED: ${{ steps.filter.outputs.workflow }}
          PROXY_CHANGED: ${{ steps.filter.outputs.proxy-server }}
          NATIVELINK_CHANGED: ${{ steps.filter.outputs.nativelink-ubuntu }}
        run: |
          set -euo pipefail
          proxy='{"name":"proxy-server","context":"./proxy-server/src","platforms":"linux/amd64,linux/arm64"}'
          nativelink='{"name":"nativelink-ubuntu","context":"./nativelink-ubuntu/src","platforms":"linux/amd64"}'

          # Workflow-file edits or manual dispatch rebuild everything, so logic changes can't skip images.
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$WORKFLOW_CHANGED" = "true" ]; then
            include="[$proxy,$nativelink]"
          else
            include="[]"
            [ "$PROXY_CHANGED"      = "true" ] && include=$(jq -cn --argjson i "$include" --argjson e "$proxy"      '$i + [$e]')
            [ "$NATIVELINK_CHANGED" = "true" ] && include=$(jq -cn --argjson i "$include" --argjson e "$nativelink" '$i + [$e]')
          fi

          echo "matrix={\"include\":$include}" >> "$GITHUB_OUTPUT"
          if [ "$include" = "[]" ]; then
            echo "has-changes=false" >> "$GITHUB_OUTPUT"
            echo "No image sources changed — build job will be skipped."
          else
            echo "has-changes=true" >> "$GITHUB_OUTPUT"
            echo "Will build: $include"
          fi

  build:
    needs: changes
    if: needs.changes.outputs.has-changes == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.changes.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Resolve latest nativelink container tag
        if: matrix.name == 'nativelink-ubuntu'
        id: nativelink_tag
        run: |
          set -euo pipefail

          # Obtain an anonymous pull token for GHCR.
          TOKEN=$(curl -sf "https://ghcr.io/token?service=ghcr.io&scope=repository:tracemachina/nativelink:pull" | jq -r .token)

          # Walk the last 30 commits on main and pick the first whose
          # 7-char short SHA exists as a container tag on GHCR.
          # Not every commit produces an image, so we probe with HEAD.
          tag=""
          for sha in $(curl -sfL "https://api.github.com/repos/tracemachina/nativelink/commits?per_page=30" | jq -r '.[].sha[:7]'); do
            if curl -sfI -o /dev/null \
                 -H "Authorization: Bearer $TOKEN" \
                 -H "Accept: application/vnd.oci.image.index.v1+json" \
                 "https://ghcr.io/v2/tracemachina/nativelink/manifests/$sha"; then
              tag="$sha"
              break
            fi
          done

          # Fall back to the latest GitHub Release if no commit tag found.
          if [ -z "$tag" ]; then
            echo "No commit-hash container tag found; falling back to latest release."
            tag=$(curl -sfL https://api.github.com/repos/tracemachina/nativelink/releases/latest | jq -r .tag_name)
          fi

          if [ -z "$tag" ] || [ "$tag" = "null" ]; then
            echo "Failed to resolve any nativelink tag" >&2
            exit 1
          fi
          echo "Using nativelink tag: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.name }} image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          platforms: ${{ matrix.platforms }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          build-args: |
            NATIVELINK_TAG=${{ steps.nativelink_tag.outputs.tag }}
